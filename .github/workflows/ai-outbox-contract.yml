name: AI outbox contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestrator and pinned services
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TFP_SUBMODULES_TOKEN }}
          submodules: recursive

      - name: Validate the cross-repository wire contract
        run: node --test scripts/contracts/validate-ai-outbox-contract.test.mjs
